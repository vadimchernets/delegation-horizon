name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (standard library only)
        run: python -m unittest discover -v
      - name: Worked examples print the expected lines
        run: |
          python horizon.py examples/c4-log.jsonl --as-of 2026-10-09 | diff - examples/c4-expected.txt
          python horizon.py examples/team-log.jsonl --as-of 2026-10-09 | diff - examples/team-expected.txt
